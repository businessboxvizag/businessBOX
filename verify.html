<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification – BusinessBOX</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0d1b3e 0%, #1a3066 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px 60px;
  }
  .logo-area { text-align: center; margin-bottom: 32px; }
  .logo-area h1 {
    font-family: 'Cinzel', serif;
    color: #c9a84c; font-size: 26px; letter-spacing: 2px;
  }
  .logo-area p { color: #aab; font-size: 13px; margin-top: 4px; }

  .search-card {
    background: #fff; border-radius: 14px;
    padding: 36px 32px; width: 100%; max-width: 500px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .search-card h2 { color: #0d1b3e; font-size: 20px; margin-bottom: 8px; }
  .search-card .desc { color: #666; font-size: 13px; margin-bottom: 24px; line-height: 1.5; }

  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 12px 16px;
    border: 2px solid #e0e0e0; border-radius: 8px;
    font-size: 15px; font-family: monospace;
    letter-spacing: 1px; text-transform: uppercase;
    outline: none; transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: #c9a84c; }
  .input-row button {
    padding: 12px 20px; background: #0d1b3e; color: #c9a84c;
    border: none; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; letter-spacing: 1px; white-space: nowrap;
  }
  .input-row button:hover { background: #162a55; }

  #result { margin-top: 28px; }

  /* NOT FOUND */
  .not-found {
    background: #fff3f3; border: 1px solid #ffcccc;
    border-radius: 10px; padding: 20px; color: #c0392b; font-size: 14px;
  }
  .not-found .icon { font-size: 36px; margin-bottom: 8px; }

  /* VERIFIED */
  .verified-card {
    background: #f0faf4; border: 2px solid #27ae60;
    border-radius: 14px; padding: 28px 24px 24px; text-align: center;
  }
  .verified-badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: #27ae60; color: #fff; border-radius: 50px;
    padding: 10px 22px; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; margin-bottom: 22px;
  }
  .verified-badge .tick { font-size: 20px; }

  .cert-name {
    font-family: 'Cinzel', serif; font-size: 22px;
    font-weight: 700; color: #0d1b3e; margin-bottom: 6px; letter-spacing: 1px;
  }
  .cert-subtitle { color: #555; font-size: 13px; margin-bottom: 20px; }

  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; text-align: left;
  }
  .detail-item {
    background: #fff; border-radius: 8px;
    padding: 12px 14px; border: 1px solid #e0e0e0;
  }
  .detail-item .label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: #999; margin-bottom: 4px;
  }
  .detail-item .value { font-size: 13px; font-weight: 600; color: #0d1b3e; }
  .detail-item.full { grid-column: 1 / -1; }
  .cert-id-badge { font-family: monospace; font-size: 13px; color: #c9a84c; font-weight: 700; }

  .footer-note { margin-top: 16px; font-size: 11px; color: #888; line-height: 1.5; }

  .bb-footer { margin-top: 40px; text-align: center; color: #6677aa; font-size: 12px; }
  .bb-footer a { color: #c9a84c; text-decoration: none; }
</style>
</head>
<body>

<div class="logo-area">
  <h1>BUSINESSBOX</h1>
  <p>Certificate Verification Portal</p>
</div>

<div class="search-card">
  <h2>🔍 Verify Certificate</h2>
  <p class="desc">Enter the Certificate ID printed on your internship certificate to verify its authenticity.</p>

  <div class="input-row">
    <input type="text" id="cert-id-input" placeholder="BB-2026-001" maxlength="20"
           oninput="this.value=this.value.toUpperCase()"
           onkeydown="if(event.key==='Enter') verifyCert()" />
    <button onclick="verifyCert()">VERIFY</button>
  </div>

  <div id="result"></div>
</div>

<div class="bb-footer">
  <p>BusinessBOX Vizag &nbsp;|&nbsp; <a href="index.html">businessbox.org.in</a></p>
</div>

<script>
function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
}

async function fetchWithTimeout(url, timeout = 5000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    return r;
  } catch(e) { clearTimeout(t); return null; }
}

async function getAllCerts() {
  // 1. GitHub (always current, works on any device)
  const ghUrl = 'https://raw.githubusercontent.com/businessboxvizag/businessBOX/main/certs.json?t=' + Date.now();
  const r = await fetchWithTimeout(ghUrl, 5000);
  if (r && r.ok) {
    try {
      const data = await r.json();
      if (Array.isArray(data) && data.length > 0) return data;
    } catch(e) {}
  }

  // 2. Fallback: localStorage (same device as admin)
  const local = JSON.parse(localStorage.getItem('bb_certs') || '[]');
  if (local.length > 0) return local;

  // 3. Fallback: certs.json on same server
  try {
    const r2 = await fetchWithTimeout('certs.json', 3000);
    if (r2 && r2.ok) {
      const data = await r2.json();
      if (Array.isArray(data)) return data;
    }
  } catch(e) {}

  return [];
}

async function verifyCert() {
  const inputId = document.getElementById('cert-id-input').value.trim().toUpperCase();
  const result  = document.getElementById('result');
  if (!inputId) { result.innerHTML = ''; return; }

  result.innerHTML = '<p style="color:#aaa;font-size:13px;margin-top:12px;">Checking...</p>';

  const certs = await getAllCerts();
  const cert  = certs.find(c => c.id.toUpperCase() === inputId);

  if (!cert) {
    result.innerHTML = `
      <div class="not-found">
        <div class="icon">✗</div>
        <strong>Certificate Not Found</strong><br>
        <span style="font-size:12px;color:#888;display:block;margin-top:6px;">
          No record found for <code>${inputId}</code>.<br>
          Please check the ID and try again, or contact BusinessBOX directly.
        </span>
      </div>`;
    return;
  }

  const issuedDate = cert.issued
    ? new Date(cert.issued).toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' })
    : '—';

  const duration = (cert.start && cert.end)
    ? formatDate(cert.start) + ' – ' + formatDate(cert.end)
    : '—';

  result.innerHTML = `
    <div class="verified-card">
      <div class="verified-badge"><span class="tick">✔</span> VERIFIED AUTHENTIC</div>
      <div class="cert-name">${cert.name.toUpperCase()}</div>
      <div class="cert-subtitle">has successfully completed the internship at BusinessBOX</div>
      <div class="detail-grid">
        <div class="detail-item full">
          <div class="label">Certificate ID</div>
          <div class="value cert-id-badge">${cert.id}</div>
        </div>
        <div class="detail-item full">
          <div class="label">Intern Name</div>
          <div class="value">${cert.name}</div>
        </div>
        <div class="detail-item full">
          <div class="label">Duration</div>
          <div class="value">${duration}</div>
        </div>
        <div class="detail-item">
          <div class="label">Designation / Role</div>
          <div class="value">${cert.role}</div>
        </div>
        <div class="detail-item">
          <div class="label">Date of Issue</div>
          <div class="value">${issuedDate}</div>
        </div>
      </div>
      <p class="footer-note">
        This certificate was issued by BusinessBOX, Vizag.<br>
        For queries: businessboxvizag@gmail.com
      </p>
    </div>`;
}
</script>
</body>
</html>
